# Apache virtual hosts — Lunch Management System (staging)
#
# Tested with Apache 2.4.58 on Ubuntu staging.
# Internal staging: HTTPS with a self-signed certificate (see deploy/STAGING.md).
#
# Replace STAGING_HOSTNAME before enabling.
#
# Prerequisites:
#   1. Create TLS files under /etc/ssl/lunch-management/ (see STAGING.md)
#   2. Enable modules:
#        sudo a2enmod proxy proxy_http headers ssl
#   3. Install:
#        sudo cp deploy/apache/lunch-management-staging.conf \
#          /etc/apache2/sites-available/lunch-management-staging.conf
#        sudo nano /etc/apache2/sites-available/lunch-management-staging.conf
#        sudo a2ensite lunch-management-staging.conf
#        sudo apache2ctl configtest
#        sudo systemctl reload apache2
#
# This vhost is additive. Existing Apache sites are not modified.

# ---------------------------------------------------------------------------
# Port 80 — permanent redirect to HTTPS only
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName STAGING_HOSTNAME

    ErrorLog ${APACHE_LOG_DIR}/lunch-management-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/lunch-management-staging-access.log combined

    Redirect permanent / https://STAGING_HOSTNAME/
</VirtualHost>

# ---------------------------------------------------------------------------
# Port 443 — TLS termination and reverse proxy to Next.js
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName STAGING_HOSTNAME

    SSLEngine on
    SSLCertificateFile /etc/ssl/lunch-management/lunch-staging.crt
    SSLCertificateKeyFile /etc/ssl/lunch-management/lunch-staging.key

    ErrorLog ${APACHE_LOG_DIR}/lunch-management-staging-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/lunch-management-staging-ssl-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
