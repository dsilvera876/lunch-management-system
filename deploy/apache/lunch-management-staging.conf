# Apache virtual host — Lunch Management System (staging)
#
# Tested with Apache 2.4.58 on Ubuntu staging.
#
# Replace STAGING_HOSTNAME before enabling, e.g. lunch-staging.comp.com
#
# Required Apache modules (enable before use):
#   sudo a2enmod proxy proxy_http headers
#   sudo a2enmod ssl   # only when configuring HTTPS later
#
# rewrite_module is commonly already enabled on existing servers but is not
# required by this vhost. Apache 2.4 mod_proxy_http handles WebSocket upgrades
# without proxy_wstunnel.
#
# Install:
#   sudo cp deploy/apache/lunch-management-staging.conf \
#     /etc/apache2/sites-available/lunch-management-staging.conf
#   sudo nano /etc/apache2/sites-available/lunch-management-staging.conf
#   sudo a2ensite lunch-management-staging.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# This vhost is additive. Existing Apache sites are not modified.

<VirtualHost *:80>
    ServerName STAGING_HOSTNAME

    ErrorLog ${APACHE_LOG_DIR}/lunch-management-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/lunch-management-staging-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    # Forward client and proxy information to Next.js.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Allow Let's Encrypt HTTP-01 challenges before HTTPS is configured.
    Alias /.well-known/acme-challenge/ /var/www/certbot/
    <Directory /var/www/certbot/>
        Require all granted
    </Directory>
</VirtualHost>

# HTTPS (configure later with Certbot — do not enable until certificates exist)
#
# After obtaining a certificate:
#   sudo a2enmod ssl
#   sudo certbot --apache -d STAGING_HOSTNAME
#
# Certbot will typically create or update an SSL vhost. Alternatively, add a
# separate *:443 VirtualHost and set:
#   SSLEngine on
#   SSLCertificateFile /etc/letsencrypt/live/STAGING_HOSTNAME/fullchain.pem
#   SSLCertificateKeyFile /etc/letsencrypt/live/STAGING_HOSTNAME/privkey.pem
#   RequestHeader set X-Forwarded-Proto "https"
#   RequestHeader set X-Forwarded-Port "443"
#
# Then run:
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
