# Nginx reverse proxy for Lunch Management System (staging)
#
# Replace placeholders before enabling:
#   STAGING_HOSTNAME          e.g. staging-lunch.example.com
#   STAGING_SSL_CERT_PATH     e.g. /etc/letsencrypt/live/staging-lunch.example.com/fullchain.pem
#   STAGING_SSL_KEY_PATH      e.g. /etc/letsencrypt/live/staging-lunch.example.com/privkey.pem
#   STAGING_UPSTREAM_PORT     e.g. 3000
#
# Install:
#   sudo cp deploy/nginx/lunch-management-staging.conf /etc/nginx/sites-available/lunch-management-staging
#   sudo ln -s /etc/nginx/sites-available/lunch-management-staging /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lunch_management_staging {
    server 127.0.0.1:STAGING_UPSTREAM_PORT;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name STAGING_HOSTNAME;

    # Allow Let's Encrypt HTTP-01 challenges before HTTPS is enabled.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name STAGING_HOSTNAME;

    ssl_certificate     STAGING_SSL_CERT_PATH;
    ssl_certificate_key STAGING_SSL_KEY_PATH;

    ssl_session_timeout 1d;
    ssl_session_cache shared:LunchManagementStagingSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://lunch_management_staging;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / upgrade support (safe for production; required for some tooling).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
